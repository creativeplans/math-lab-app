<style>
  :root {
    color-scheme: light;
    --ink: #1b2430;
    --muted: #5b6672;
    --bg: #f6f8fb;
    --card: #ffffff;
    --border: #dfe5ec;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .app { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .screen[hidden] { display: none !important; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; }

  form { display: flex; flex-direction: column; gap: 14px; max-width: 320px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.9rem; }
  input, select {
    font-size: 1rem;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
  }
  button {
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button.secondary { background: var(--border); color: var(--ink); }
  .error { color: var(--danger); font-weight: 600; }
  .hint { color: var(--muted); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: end;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .filters label { min-width: 120px; }
  .filters button { align-self: flex-end; height: 40px; }
  .checkbox-field {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    font-weight: 500;
    align-self: flex-end;
    height: 40px;
  }
  .checkbox-field input { width: 16px; height: 16px; }

  .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.wrap { white-space: normal; max-width: 280px; }
  th { position: sticky; top: 0; background: var(--card); }
</style>
