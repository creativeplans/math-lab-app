<style>
  :root {
    color-scheme: light;
    --ink: #1b2430;
    --muted: #5b6672;
    --bg: #f6f8fb;
    --card: #ffffff;
    --border: #dfe5ec;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --success: #1a8a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .screen[hidden] { display: none !important; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 24px 0 10px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; }

  form { display: flex; flex-direction: column; gap: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.9rem; }
  input[type=text], input[type=search], select {
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
  }
  input[type=search] { width: 100%; margin: 12px 0; }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .link-btn, .back-btn {
    background: none;
    color: var(--accent);
    padding: 6px 0;
    font-weight: 600;
  }
  .checkbox-label { flex-direction: row; align-items: center; gap: 10px; font-weight: 500; }
  .checkbox-label input { width: 18px; height: 18px; }

  .grade-buttons { display: flex; gap: 12px; margin: 20px 0; }
  .grade-btn {
    flex: 1;
    padding: 28px 12px;
    font-size: 1.2rem;
    border-radius: 12px;
  }

  .home-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .home-header h1 { flex: 1 1 auto; text-align: center; }

  .problem-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .problem-card h3 { margin: 0 0 10px; }
  .video-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .video-chip {
    flex: 1 1 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    font-weight: 600;
    color: var(--ink);
  }
  .video-chip .done-mark { color: var(--success); font-size: 0.85rem; }

  .video-list { display: flex; flex-direction: column; gap: 8px; }
  .video-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
  }

  .player-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  #yt-player { position: absolute; inset: 0; width: 100%; height: 100%; }

  .hint { color: var(--muted); text-align: center; margin: 16px 0; }
  .hint.success { color: var(--success); font-weight: 700; font-size: 1.1rem; }
  .response-form { margin-top: 16px; }

  @media (max-width: 420px) {
    .grade-buttons { flex-direction: column; }
  }
</style>
